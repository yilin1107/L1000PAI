name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Existing tag or commit to validate without rewriting it'
        required: false
        type: string
      expected_sha:
        description: 'Required 40-character commit when source_ref is supplied'
        required: false
        type: string

permissions:
  contents: read

jobs:
  core-package:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install macOS X11 runtime for gdtools
        if: runner.os == 'macOS'
        run: brew install --cask xquartz
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - name: Record tested Git commit
        shell: Rscript {0}
        env:
          TEST_SOURCE_REF: ${{ inputs.source_ref }}
          TEST_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual <- trimws(system2("git", c("rev-parse", "HEAD"), stdout = TRUE))
          expected <- Sys.getenv("TEST_EXPECTED_SHA")
          ref <- Sys.getenv("TEST_SOURCE_REF")
          if (!nzchar(ref)) expected <- Sys.getenv("GITHUB_SHA")
          stopifnot(grepl("^[0-9a-f]{40}$", expected), identical(actual, expected))
          record <- c(paste0("source_sha=", actual), paste0("expected_sha=", expected),
                      paste0("source_ref=", ref), paste0("workflow_sha=", Sys.getenv("GITHUB_SHA")))
          writeLines(record, file.path(Sys.getenv("RUNNER_TEMP"), "tested-source.txt"))
          cat(paste(record, collapse = "\n"), "\n")
      - name: Preserve source attestation
        uses: actions/upload-artifact@v4
        with:
          name: tested-source-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: ${{ runner.temp }}/tested-source.txt
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown, bioc::BiocStyle, any::ggplot2, any::ggrepel
          needs: check
      - name: Install the tiny companion contract fixture
        shell: bash
        run: R CMD INSTALL tests/fixtures/L1000PAIdata
      - name: Build vignettes and check the core package
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )

  real-libraries:
    name: ubuntu-latest / R release / downloaded L1000 libraries
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Record tested Git commit
        shell: Rscript {0}
        env:
          TEST_SOURCE_REF: ${{ inputs.source_ref }}
          TEST_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          actual <- trimws(system2("git", c("rev-parse", "HEAD"), stdout = TRUE))
          expected <- Sys.getenv("TEST_EXPECTED_SHA")
          ref <- Sys.getenv("TEST_SOURCE_REF")
          if (!nzchar(ref)) expected <- Sys.getenv("GITHUB_SHA")
          stopifnot(grepl("^[0-9a-f]{40}$", expected), identical(actual, expected))
          record <- c(paste0("source_sha=", actual), paste0("expected_sha=", expected),
                      paste0("source_ref=", ref), paste0("workflow_sha=", Sys.getenv("GITHUB_SHA")))
          writeLines(record, file.path(Sys.getenv("RUNNER_TEMP"), "tested-source.txt"))
          cat(paste(record, collapse = "\n"), "\n")
      - name: Preserve source attestation
        uses: actions/upload-artifact@v4
        with:
          name: tested-source-real-libraries
          path: ${{ runner.temp }}/tested-source.txt
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown, bioc::BiocStyle, any::ggplot2, any::ggrepel, github::yilin1107/L1000PAIdata@v1.0.0
          needs: check
      - name: Download and verify the crispr, chem and kinase/GPCR libraries
        shell: Rscript {0}
        run: L1000PAIdata::download_l1000pai_data("all")
      - name: Check the core package against the downloaded libraries
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )
